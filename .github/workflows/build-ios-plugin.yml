name: build-ios-plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build static library
        run: bash tools/ios-build/build.sh

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: libCoolWearBLEPlugin
          path: tools/ios-build/out/libCoolWearBLEPlugin.a
