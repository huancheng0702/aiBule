apply plugin: 'com.android.application'
// apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.1"

    defaultConfig {
        applicationId "com.coolwear.ctest"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 启用ViewBinding
        viewBinding {
            enabled true
        }
    }
    signingConfigs {
        cwsdk {
            storeFile file('../storeFile/cwsdk.jks')
            storePassword 'cwsdk@123'
            keyAlias 'cwsdk'
            keyPassword "cwsdk@123"
        }
    }
    lintOptions {
        abortOnError false
    }
    buildTypes {
        release {
            multiDexEnabled true
            minifyEnabled true
            debuggable true
            signingConfig signingConfigs.cwsdk
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'versionDateTime', '\"' + releaseTime() + '\"'
        }
        debug {
            multiDexEnabled true
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.cwsdk
            versionNameSuffix "fortest"
            buildConfigField "Integer", "BUILDTYPE", "3"
            buildConfigField 'String', 'versionDateTime', '\"' + releaseTime() + '\"'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    packagingOptions {//加上这些代码
        pickFirst 'META-INF/DEPENDENCIES'
    }

    repositories {
        flatDir {
            dir 'libs'
        }
    }
    flavorDimensions "cwsdk"
    productFlavors {
        sdkforTesting {
            dimension "cwsdk"
            buildConfigField "Integer", "BUILDTYPE", "1"
        }
        sdkforOTA {
            dimension "cwsdk"
            buildConfigField "Integer", "BUILDTYPE", "2"
        }
        sdkforTestingAndOTA {
            buildConfigField "Integer", "BUILDTYPE", "3"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.2.2'
    testImplementation 'junit:junit:4.13'
    implementation 'androidx.core:core-ktx:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'com.github.hedzr:android-file-chooser:master-SNAPSHOT'
    implementation 'com.nbsp:materialfilepicker:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.kaopiz:kprogresshud:1.2.0'
    implementation 'com.liulishuo.okdownload:okdownload:1.0.7'
//    implementation 'com.yanzhenjie:permission:2.0.3'
    implementation 'pub.devrel:easypermissions:3.0.0'
    //裁剪
    implementation 'com.github.yalantis:ucrop:2.2.3'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.3.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation 'io.reactivex.rxjava2:rxjava:2.1.9'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'org.xutils:xutils:3.8.9'
    //implementation project(path: ':coolwear_bluesdk')
//    implementation project(path: ':socket_client')
    implementation files('libs/coolwear_bluesdk-release.aar')
//    implementation files('libs/bluesdk_Nicex_Watch_V2.1.0_20230711.aar')

    implementation files('libs/AliAgent-release-3.3.7.aar')
    implementation files('libs/org.eclipse.paho.android.service_V1.1.1-release.aar')
//    implementation files('libs/bluesdk_Nicex Watch_V2.1.0_20230707.aar')
//    implementation files('libs/bluesdk_S8_MAX_V2.1.0_20230428.aar')
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:2.8.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.0'
//    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'com.github.xuexiangjys:XUI:1.1.4'
    implementation 'com.gyf.immersionbar:immersionbar:3.0.0-beta05'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.tencent.bugly:crashreport:latest.release'
    // 二维码
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.0'
